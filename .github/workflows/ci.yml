name: wfc checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    name: fast (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run fast checks
        run: make check-fast

  full:
    name: full release gate
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - name: Run full checks
        run: make check-full
